<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Confirmado | Vikko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #F8F9FA;
            color: #1E293B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 40px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            color: #64748B;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .badge {
            display: inline-block;
            background-color: #ECE9FE;
            color: #6C5CE7;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">💜</div>
        <h1>E-mail Confirmado!</h1>
        <p>A tua conta na <strong>Vikko</strong> está ativa e pronta a ser utilizada.</p>
        <div class="badge">Podes fechar este separador e voltar à app.</div>
    </div>
</body>
</html>
